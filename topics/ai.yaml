slug: ai
title: KI Daily
description: Dein 5-Minuten-Briefing zu Künstlicher Intelligenz – täglich frisch um 6 Uhr.
language: de
# --- Recherche / Kosten ---
# research_model: claude-haiku-4-5  # Budget-Option (~1/2 Preis); auskommentiert = Sonnet 5
search_max_uses: 8                  # Such-Runden pro Lauf (Haupt-Kostentreiber; vorher 15)
research_effort: medium             # low | medium | high – drosselt Thinking-Tokens

# --- TTS ---
tts_provider: openai                # openai | elevenlabs
voice: sage                         # OpenAI: alloy, ash, ballad, coral, echo, fable, nova, onyx, sage, shimmer
tts_model: gpt-4o-mini-tts          # günstig + steuerbar via instructions
tts_instructions: |
  Lies in flottem Tempo, klar und gut artikuliert, wie ein moderner deutscher Nachrichten-Sprecher.
  Leichte Ironie bei Wirtschaftsmeldungen ist erlaubt – sonst sachlich und seriös.
  Englische Eigennamen deutlich aussprechen, keine Überdramatisierung.
# ElevenLabs-Fallback (greift, wenn tts_provider: elevenlabs gesetzt wird):
voice_id: pNInz6obpgDQGcFmaJgB
voice_model: eleven_multilingual_v2
target_minutes: 5
research_prompt: |
  Recherchiere die wichtigsten Nachrichten aus den Bereichen Künstliche Intelligenz,
  Large Language Models, KI-Anwendungen, KI-Forschung, KI-Industrie und KI-Regulierung
  der letzten 24 Stunden. Konzentriere dich auf substantielle Entwicklungen: neue
  Modelle und Releases, Forschungsergebnisse, Unternehmensankündigungen (OpenAI,
  Anthropic, Google DeepMind, Meta, Mistral, xAI usw.), Regulierung, Übernahmen,
  größere Investitionen und gesellschaftliche Debatten.
preferred_sources:
