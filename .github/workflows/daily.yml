name: Daily podcast build

on:
  schedule:
    # GitHub-Actions-Schedules sind unzuverlässig (skippen gelegentlich ganze Slots).
    # Darum mehrere Versuche; das Build-Skript erkennt eine bereits vorhandene Folge
    # des Tages und überspringt die teuren Schritte – nur Feed wird ggf. neu gebaut.
    - cron: '30 3 * * *'  # 04:30/05:30 Berlin (Winter/Sommer) – Haupt-Slot
    - cron: '30 4 * * *'  # 05:30/06:30 Berlin – Backup
    - cron: '0 6 * * *'   # 07:00/08:00 Berlin – letzter Backup, definitiv vor Mittag
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic-Slug bauen (leer = alle)'
        required: false
        default: ''
      force:
        description: 'Existierende Folge des Tages überschreiben'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build episode(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          TOPIC_INPUT: ${{ github.event.inputs.topic }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          set -e
          FORCE=""
          [ "$FORCE_INPUT" = "true" ] && FORCE="--force"
          if [ -n "$TOPIC_INPUT" ]; then
            python scripts/build_podcast.py "$TOPIC_INPUT" $FORCE
          else
            for f in topics/*.yaml; do
              slug=$(basename "$f" .yaml)
              python scripts/build_podcast.py "$slug" $FORCE || echo "::warning::Build für $slug fehlgeschlagen"
            done
          fi

      - name: Commit & push
        run: |
          git config user.name "news2pod-bot"
          git config user.email "bot@news2pod.local"
          git add docs/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "daily episode $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOPIC_INPUT: ${{ github.event.inputs.topic }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC nicht gesetzt – überspringe Notification."
            exit 0
          fi
          curl -sS \
            -H "Title: news2pod build failed" \
            -H "Priority: high" \
            -H "Tags: warning,podcast" \
            -d "Topic: ${TOPIC_INPUT:-alle} – Details: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
